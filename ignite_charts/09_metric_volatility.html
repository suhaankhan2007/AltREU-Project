<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; background:#101014; overflow:hidden; }
  body { font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; }
  .wrap { width:1440px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:#9c9ca6; margin-bottom:28px; text-align:center; }
  .rows { display:flex; flex-direction:column; gap:64px; }
  .row { display:flex; align-items:center; gap:36px; }
  .rlabel { flex:0 0 260px; text-align:right; }
  .rlabel .name { font-family:'Fraunces',serif; font-weight:600; font-size:42px; color:#f2f2f5; }
  .rlabel .desc { font-size:17px; color:#67676f; margin-top:4px; }
  .track { flex:1; height:64px; background:#16161c; border-radius:8px; position:relative; overflow:visible; }
  .fill { position:absolute; top:0; left:0; bottom:0; border-radius:8px; display:flex; align-items:center; }
  .fill.f1 { width:66.2%; background:#e0534a; }
  .fill.auc { width:4.4%; background:#5a9aea; }
  .tickmark { position:absolute; top:-10px; bottom:-10px; width:1px; background:rgba(148,160,190,.15); }
  .val { position:absolute; right:-140px; top:50%; transform:translateY(-50%); font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:500; }
  .val.f1 { color:#e0534a; }
  .val.auc { color:#5a9aea; }
  .axislabel { text-align:center; font-size:16px; color:#67676f; margin-top:20px; font-family:'JetBrains Mono',monospace; }
  .caption { text-align:center; font-size:19px; color:#9c9ca6; margin-top:40px; line-height:1.5; }
</style></head>
<body>
<div class="wrap">
  <div class="eyebrow">Same 5-seed sweep, two ways of scoring it</div>
  <div class="rows">
    <div class="row">
      <div class="rlabel"><div class="name">F1</div><div class="desc">fixed 0.5 threshold</div></div>
      <div class="track">
        <div class="tickmark" style="left:33%"></div>
        <div class="fill f1"><div class="val f1">±33%</div></div>
      </div>
    </div>
    <div class="row">
      <div class="rlabel"><div class="name">ROC-AUC</div><div class="desc">threshold-free</div></div>
      <div class="track">
        <div class="tickmark" style="left:33%"></div>
        <div class="fill auc"><div class="val auc">±2%</div></div>
      </div>
    </div>
  </div>
  <div class="axislabel">variability across identical re-runs (std as % of mean)</div>
  <div class="caption">F1 = 0.2226 ± 0.0737&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;ROC-AUC = 0.9462 ± 0.0211&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;5 seeds, same data, same model</div>
</div>
</body></html>
