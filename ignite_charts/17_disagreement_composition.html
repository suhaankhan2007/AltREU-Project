<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; background:#101014; overflow:hidden; }
  body { font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; }
  .wrap { width:1300px; text-align:center; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:#9c9ca6; margin-bottom:10px; }
  .title { font-family:'Fraunces',serif; font-weight:600; font-size:40px; color:#f2f2f5; margin-bottom:56px; }
  .grid { display:grid; grid-template-columns:repeat(11,1fr); gap:22px; width:900px; margin:0 auto; }
  .icon { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .icon.solved { background:#2f7fe0; }
  .icon.unsolved { background:transparent; border:2px solid #67676f; }
  .icon svg { width:30px; height:30px; }
  .caption { margin-top:56px; font-size:22px; color:#f2f2f5; line-height:1.6; }
  .caption b { font-family:'JetBrains Mono',monospace; color:#5a9aea; font-weight:500; }
  .sub { margin-top:14px; font-size:18px; color:#67676f; }
</style></head>
<body>
<div class="wrap">
  <div class="eyebrow">The 22 events volunteers couldn't agree on</div>
  <div class="title">What were they, really?</div>
  <div class="grid" id="grid"></div>
  <div class="caption"><b>17 of 22</b> are real microlensing the model already scored 93–100% confident</div>
  <div class="sub">Volunteers disagreed most on exactly the cases the AI had already solved</div>
</div>
<script>
  const grid = document.getElementById('grid');
  const check = '<svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5l3 3L15 3"/></svg>';
  const dash = '<svg viewBox="0 0 16 16" fill="none" stroke="#67676f" stroke-width="2" stroke-linecap="round"><path d="M4 8h8"/></svg>';
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('div');
    if (i < 17) { d.className = 'icon solved'; d.innerHTML = check; }
    else { d.className = 'icon unsolved'; d.innerHTML = dash; }
    grid.appendChild(d);
  }
</script>
</body></html>
